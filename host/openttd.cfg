; OpenTTD settings for the bare-metal build.
;
; This file is copied to the card as games/openttd/openttd.cfg. OpenTTD reads
; it at startup and writes it back on exit, so anything changed inside the
; game is kept — this is the starting state, not a fixed configuration.
;
; Only the settings that have to differ on this board are here. Every other
; setting keeps OpenTTD's own default.

[misc]
; The display is one fixed panel and the host kernel declares its size to the
; SDL layer before the game starts. This must match that declaration:
; the game cannot be given a size the display was never declared at.
resolution = 640,480
fullscreen = true

; The language file to load, from lang/ in this directory.
language = english.lng

[music]
; There is no music on this board. The only music backend that could be
; compiled in plays a MIDI file by starting a separate program, and there is
; no second process on bare metal.
playlist = 0

[gui]
; Confirm before leaving the game. On a board with no window manager there is
; nothing to alt-tab to and an accidental quit costs the whole session.
autosave_on_exit = true
